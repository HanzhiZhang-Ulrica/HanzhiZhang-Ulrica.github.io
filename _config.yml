# Basic Site Settings
locale                   : "en-US"
title                    : "Hanzhi Zhang | Per Aspera Ad Astra"
title_separator          : "-"
name                     : &name "Hanzhi Zhang"
description              : &description "personal description"
url                      : https://hanzhizhang-ulrica.github.io/
baseurl                  : ""
repository               : "HanzhiZhang-Ulrica/hanzhizhang-ulrica.github.io/"

# Multi-language support
languages:
  - en
  - zh

# Site Author
author:
  avatar           : "profile.png"
  name             : "Hanzhi Zhang"
  pronouns         : "she/her"
  bio              : "Responsible AI, AI Hallucination, Large Language Models, Small Language Models"
  location         : "Earth"
  employer         : "University of North Texas"
  email            : "hanzhizhang@my.unt.edu"
  orcid            : "https://orcid.org/0009-0004-0145-9814"
  github           : "HanzhiZhang-Ulrica"
  linkedin         : "hanzhi-zhang-636929225"

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "enabled"  # Enable "Read more" links for excerpts
talkmap_link             : false

# Comments
comments:
  provider               : false

# RSS Feed
atom_feed:
  hide                   : false

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
og_image                 :

# Analytics
analytics:
  provider               : "false"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "<!--more-->"  # Use <!--more--> as the excerpt separator
incremental: false

# Markdown Processing
kramdown:
  input: Kramdown
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:slug/  # Avoid using Chinese characters in permalink
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
