{% assign publication = include.publication %}
{% if publication.paperurl %}
  {% if publication.paperurl contains 'arxiv.org/' %}<a class="btn-pill btn-arxiv" href="{{ publication.paperurl }}">arXiv</a>{% else %}<a class="btn-pill btn-pdf" href="{{ publication.paperurl }}">Paper</a>{% endif %}
{% endif %}
{% if publication.codeurl %} <a class="btn-pill btn-code" href="{{ publication.codeurl }}">Code</a>{% endif %}
{% if publication.dataurl %} <a class="btn-pill btn-data" href="{{ publication.dataurl }}">Dataset</a>{% endif %}
